<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIN$ M5 · Close − MME30</title>
  <meta name="description" content="Oscilador da distância em pontos entre o fechamento do WIN$ M5 e a MME de 30 períodos, plotado em torno do eixo zero.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0b0e17; --panel: rgba(22, 27, 43, 0.72); --border: rgba(120, 140, 200, 0.14);
      --text: #e6e9f2; --muted: #8a93ad; --up: #22d3a6; --down: #f4527a; --accent: #7c8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif; color: var(--text); min-height: 100vh;
      padding: 24px clamp(12px, 3vw, 36px) 32px;
      background:
        radial-gradient(1000px 500px at 0% -10%, rgba(34, 211, 166, 0.10), transparent 60%),
        radial-gradient(1000px 500px at 100% 110%, rgba(244, 82, 122, 0.10), transparent 60%),
        var(--bg);
    }
    header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { font-size: clamp(1.3rem, 2.4vw, 1.9rem); font-weight: 700; letter-spacing: -0.02em; }
    h1 span { background: linear-gradient(90deg, var(--up), var(--accent), var(--down)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
    .group { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    button { font: 500 .82rem 'Inter'; color: var(--muted); background: none; border: 0; padding: 7px 13px; border-radius: 7px; cursor: pointer; transition: all .18s; }
    button:hover { color: var(--text); background: rgba(255,255,255,.05); }
    button.active { color: #fff; background: rgba(124,140,255,.22); box-shadow: inset 0 0 0 1px rgba(124,140,255,.35); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; animation: rise .5s ease both; transition: transform .2s, border-color .2s; }
    .stat:hover { transform: translateY(-2px); border-color: rgba(124,140,255,.35); }
    .stat div { color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; }
    .stat b { display: block; font: 600 1.15rem 'JetBrains Mono', monospace; margin-top: 4px; }

    .chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 10px; position: relative; animation: rise .6s ease both .1s; }
    #chart { width: 100%; height: calc(100vh - 290px); min-height: 460px; }
    .legend { position: absolute; top: 18px; left: 22px; z-index: 5; pointer-events: none; font: 500 .82rem 'JetBrains Mono', monospace;
      display: flex; gap: 14px; background: rgba(11,14,23,.65); padding: 6px 10px; border-radius: 8px; }
    .legend .k { color: var(--muted); }
    .note { color: var(--muted); font-size: .78rem; margin-top: 12px; line-height: 1.5; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>WIN$ M5 · <span>Close − MME30</span></h1>
      <p class="sub" id="periodo">—</p>
    </div>
    <div class="group" id="ranges">
      <button data-d="1" id="btn-1d">1D</button>
      <button data-d="5" id="btn-5d" class="active">5D</button>
      <button data-d="22" id="btn-1m">1M</button>
      <button data-d="66" id="btn-3m">3M</button>
      <button data-d="0" id="btn-all">Tudo</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <main class="chart-wrap">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </main>

  <p class="note">
    Valor = Close − MME30, em pontos. Acima de zero (verde): fechamento acima da média. Abaixo de zero (vermelho): fechamento abaixo da média.
    As linhas tracejadas marcam os percentis 5% e 95% de todo o histórico.
  </p>

  <script src="mme30_data.js"></script>
  <script>
    const D = window.MME_DATA, LC = LightweightCharts, S = D.stats.close;
    const nf = v => v.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
    const fmt = v => (v > 0 ? '+' : '') + nf(v);

    document.getElementById('periodo').textContent =
      `${D.inicio} → ${D.fim} · ${D.n.toLocaleString('pt-BR')} candles`;

    // Série Close − MME30
    const dist = new Array(D.n);
    let acima = 0;
    for (let i = 0; i < D.n; i++) {
      const v = +(D.c[i] - D.m[i]).toFixed(1);
      dist[i] = { time: D.t[i], value: v };
      if (v > 0) acima++;
    }

    document.getElementById('stats').innerHTML = [
      ['Último', fmt(dist[D.n - 1].value), dist[D.n - 1].value >= 0 ? 'var(--up)' : 'var(--down)'],
      ['Média |dist|', nf(S.media_abs)],
      ['Desvio', nf(S.desvio)],
      ['P5', fmt(S.p05), 'var(--down)'],
      ['P95', fmt(S.p95), 'var(--up)'],
      ['|P99|', nf(S.p99_abs)],
      ['% acima da MME', nf(acima / D.n * 100) + '%'],
    ].map(([k, v, c], i) => `<article class="stat" style="animation-delay:${i * 50}ms"><div>${k}</div><b style="color:${c || 'inherit'}">${v}</b></article>`).join('');

    const el = document.getElementById('chart');
    const chart = LC.createChart(el, {
      autoSize: true,
      layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#8a93ad', fontFamily: 'Inter' },
      grid: { vertLines: { color: 'rgba(120,140,200,0.06)' }, horzLines: { color: 'rgba(120,140,200,0.06)' } },
      crosshair: { mode: LC.CrosshairMode.Normal },
      rightPriceScale: { borderColor: 'rgba(120,140,200,0.15)', scaleMargins: { top: 0.08, bottom: 0.08 } },
      timeScale: { borderColor: 'rgba(120,140,200,0.15)', timeVisible: true, secondsVisible: false, rightOffset: 6 },
      localization: { locale: 'pt-BR', priceFormatter: nf },
    });

    // Baseline em 0: verde acima, vermelho abaixo
    const serie = chart.addSeries(LC.BaselineSeries, {
      baseValue: { type: 'price', price: 0 },
      topLineColor: '#22d3a6', topFillColor1: 'rgba(34,211,166,0.40)', topFillColor2: 'rgba(34,211,166,0.04)',
      bottomLineColor: '#f4527a', bottomFillColor1: 'rgba(244,82,122,0.04)', bottomFillColor2: 'rgba(244,82,122,0.40)',
      lineWidth: 2, priceLineVisible: false,
    });
    serie.setData(dist);

    const linha = (price, color, title, style = LC.LineStyle.Dashed) =>
      serie.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title });
    linha(0, '#7c8cff', 'MME30', LC.LineStyle.Solid);
    linha(S.p95, 'rgba(34,211,166,0.7)', 'P95');
    linha(S.p05, 'rgba(244,82,122,0.7)', 'P5');

    // Legenda
    const legend = document.getElementById('legend');
    const idx = new Map(D.t.map((t, i) => [t, i]));
    const render = i => {
      i ??= D.n - 1;
      const v = dist[i].value;
      const data = new Date(D.t[i] * 1000).toLocaleString('pt-BR', { timeZone: 'UTC', dateStyle: 'short', timeStyle: 'short' });
      legend.innerHTML = `<span class="k">${data}</span>
        <span><span class="k">Close</span> ${nf(D.c[i])}</span>
        <span style="color:#7c8cff"><span class="k">MME30</span> ${nf(D.m[i])}</span>
        <span style="color:${v >= 0 ? '#22d3a6' : '#f4527a'}">Dist ${fmt(v)}</span>`;
    };
    chart.subscribeCrosshairMove(p => render(p.time ? idx.get(p.time) : null));
    render();

    // Períodos (em pregões)
    const setRange = dias => {
      const ts = chart.timeScale();
      if (!dias) return ts.fitContent();
      let n = 0, ult = null, i = D.n - 1;
      for (; i >= 0; i--) {
        const d = Math.floor(D.t[i] / 86400);
        if (d !== ult) { n++; ult = d; if (n > dias) break; }
      }
      ts.setVisibleRange({ from: D.t[Math.max(0, i + 1)], to: D.t[D.n - 1] });
    };
    document.querySelectorAll('#ranges button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#ranges button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      setRange(+b.dataset.d);
    }));
    setRange(5);
  </script>
</body>
</html>
